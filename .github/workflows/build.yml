name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libobs
        run: sudo apt-get update && sudo apt-get install -y libobs-dev cmake build-essential
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build
        run: cmake --build build
      - name: Package
        run: |
          DESTDIR="$PWD/dist" cmake --install build
          VERSION=$(sed -nE 's/^project\(boomboxstream VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          mkdir -p release
          tar -C dist -czf "release/boomboxstream-$VERSION-linux-x86_64.tar.gz" usr
      - uses: actions/upload-artifact@v4
        with:
          name: boomboxstream-linux
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release/

  windows:
    runs-on: windows-2022
    env:
      # Compila contra a API do OBS 30.2; roda também no OBS 31/32.
      OBS_VERSION: 30.2.3
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch OBS headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:OBS_VERSION --filter=blob:none --sparse https://github.com/obsproject/obs-studio.git obs-src
          git -C obs-src sparse-checkout set libobs deps/w32-pthreads

      - name: Fetch OBS DLLs and make import libraries
        shell: pwsh
        run: |
          $zip = "OBS-Studio-$env:OBS_VERSION-Windows.zip"
          Invoke-WebRequest "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/$zip" -OutFile obs.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          New-Item -ItemType Directory -Force sdk | Out-Null
          $archive = [System.IO.Compression.ZipFile]::OpenRead("$PWD/obs.zip")
          foreach ($name in 'obs', 'w32-pthreads') {
            $entry = $archive.GetEntry("bin/64bit/$name.dll")
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry, "$PWD/sdk/$name.dll", $true)
            $exports = dumpbin /exports "sdk/$name.dll" | ForEach-Object {
              if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] }
            }
            if (-not $exports) { throw "no exports found in $name.dll" }
            Set-Content "sdk/$name.def" (@("LIBRARY $name", "EXPORTS") + $exports)
            lib /nologo /def:"sdk/$name.def" /machine:x64 /out:"sdk/$name.lib"
            if ($LASTEXITCODE -ne 0) { throw "lib failed for $name" }
            Write-Host "$name.dll: $($exports.Count) exports"
          }
          $archive.Dispose()

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DLIBOBS_INCLUDE_DIR="$PWD/obs-src/libobs"
          -DLIBOBS_LIB="$PWD/sdk/obs.lib"
          -DW32_PTHREADS_INCLUDE_DIR="$PWD/obs-src/deps/w32-pthreads"
          -DW32_PTHREADS_LIB="$PWD/sdk/w32-pthreads.lib"

      - name: Build
        run: cmake --build build --config Release

      - name: Package (zip + installer)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(boomboxstream VERSION (\d+\.\d+\.\d+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version in CMakeLists.txt"
          }

          cmake --install build --config Release --prefix dist
          Get-ChildItem -Recurse dist | Select-Object FullName

          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath "release/boomboxstream-$version-windows-x64.zip"

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DMyAppVersion=$version" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\release" installer\boomboxstream.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem release | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: boomboxstream-windows-x64
          path: dist/

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/

  release:
    # Publica uma Release ao enviar uma tag "vX.Y.Z" (igual à versão do CMakeLists.txt).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            ## Instalar no Windows
            - **Instalador:** baixe `boomboxstream-*-windows-x64-installer.exe`, feche o OBS e execute. Ele encontra a pasta do OBS sozinho.
            - **Manual:** extraia `boomboxstream-*-windows-x64.zip` dentro da pasta do OBS (normalmente `C:\Program Files\obs-studio`).

            Depois: botão direito na fonte ou na cena → *Filtros* → **+** → **BoomBox (Reativo ao Áudio)**.
            Compatível com OBS 30, 31 e 32 (64 bits).

            ## Linux
            `boomboxstream-*-linux-x86_64.tar.gz` (compilado no Ubuntu 24.04): `sudo tar -C / -xzf boomboxstream-*.tar.gz`.

            ## Só shader (plugin Shaderfilter 2.6+)
            Use `shaders/boombox.shader` do código-fonte.
